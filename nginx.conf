# ══════════════════════════════════════════════════════════════
#  Enterprise PII Gateway — NGINX v3.0
#  Supports all 4 TLS modes:
#    MODE 1 (corp_ca)  : Single gateway cert signed by Corp CA
#    MODE 2 (dns)      : SNI — per-domain cert for each LLM API
#    MODE 3 (sidecar)  : Plain HTTP from sidecar (no TLS intercept)
#    MODE 4 (scrub_api): Apps POST to /scrub directly
# ══════════════════════════════════════════════════════════════

events { worker_connections 8192; }

stream {
    # ── SNI-based routing (DNS Interception Mode) ─────────────
    # Each LLM domain gets its own cert — Copilot sees correct cert
    map $ssl_preread_server_name $backend_name {
        "api.anthropic.com"                  pii_gateway;
        "api.openai.com"                     pii_gateway;
        "generativelanguage.googleapis.com"  pii_gateway;
        "api.githubcopilot.com"              pii_gateway;
        default                              pii_gateway;
    }

    upstream pii_gateway_stream {
        server gateway-1:8080;
        server gateway-2:8080;
        server gateway-3:8080;
    }

    # Port 443 — DNS interception mode (intercepts Copilot, all apps)
    server {
        listen 443;
        ssl_preread on;
        proxy_pass pii_gateway_stream;
    }
}

http {
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$http_x_user_id" "$http_x_department"';

    access_log /var/log/nginx/access.log main;

    # ── Upstream: 3 Gateway nodes (HA) ───────────────────────
    upstream pii_gateway {
        least_conn;
        server gateway-1:8080 max_fails=3 fail_timeout=30s;
        server gateway-2:8080 max_fails=3 fail_timeout=30s;
        server gateway-3:8080 max_fails=3 fail_timeout=30s;
        keepalive 128;
    }

    # ── MODE 1: Corp CA Mode ──────────────────────────────────
    # Single cert signed by your corporate CA
    # Push corp CA to all machines via GPO → zero cert errors
    server {
        listen 8443 ssl;
        server_name pii-gateway.internal;

        ssl_certificate     /etc/nginx/certs/gateway.crt;
        ssl_certificate_key /etc/nginx/certs/gateway.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_timeout 1d;

        client_max_body_size 50M;
        proxy_read_timeout   300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;

        location / {
            proxy_pass             http://pii_gateway;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto https;
            proxy_set_header       X-Target-Host     $host;
        }

        location /health {
            proxy_pass http://pii_gateway/health;
            access_log off;
        }
    }

    # ── MODE 2: DNS Interception — Anthropic cert ─────────────
    # When DNS resolves api.anthropic.com → gateway IP
    # Gateway presents cert FOR api.anthropic.com (signed by corp CA)
    # Corp CA trusted on all machines → no cert error in Copilot!
    server {
        listen 8444 ssl;
        server_name api.anthropic.com;

        ssl_certificate     /etc/nginx/certs/api_anthropic_com.crt;
        ssl_certificate_key /etc/nginx/certs/api_anthropic_com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 50M;
        proxy_read_timeout   300s;

        location / {
            proxy_pass         http://pii_gateway;
            proxy_set_header   Host          api.anthropic.com;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   X-Target-Host api.anthropic.com;
        }
    }

    # ── MODE 2: DNS Interception — OpenAI cert ────────────────
    server {
        listen 8445 ssl;
        server_name api.openai.com;

        ssl_certificate     /etc/nginx/certs/api_openai_com.crt;
        ssl_certificate_key /etc/nginx/certs/api_openai_com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 50M;
        proxy_read_timeout   300s;

        location / {
            proxy_pass         http://pii_gateway;
            proxy_set_header   Host          api.openai.com;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   X-Target-Host api.openai.com;
        }
    }

    # ── MODE 2: DNS Interception — GitHub Copilot cert ────────
    server {
        listen 8446 ssl;
        server_name api.githubcopilot.com;

        ssl_certificate     /etc/nginx/certs/api_githubcopilot_com.crt;
        ssl_certificate_key /etc/nginx/certs/api_githubcopilot_com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 50M;
        proxy_read_timeout   300s;

        location / {
            proxy_pass         http://pii_gateway;
            proxy_set_header   Host          api.githubcopilot.com;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   X-Target-Host api.githubcopilot.com;
        }
    }

    # ── MODE 3: Sidecar HTTP (no TLS from sidecar) ────────────
    # Sidecar sends plain HTTP to gateway (within internal network)
    # Gateway handles real HTTPS to LLM — no cert issues at all
    server {
        listen 7778;  # Internal-only sidecar port (not exposed externally)
        server_name localhost 127.0.0.1;

        client_max_body_size 50M;
        proxy_read_timeout   300s;

        location / {
            proxy_pass       http://pii_gateway;
            proxy_set_header X-Real-IP    $remote_addr;
            proxy_set_header X-Client-Mode sidecar;
        }

        location /scrub {
            proxy_pass http://pii_gateway/scrub;
        }
    }

    # ── Health + Metrics (internal only) ─────────────────────
    server {
        listen 9090;
        server_name localhost;

        location /health  { proxy_pass http://pii_gateway/health;  }
        location /metrics { proxy_pass http://pii_gateway/metrics; }
    }
}
